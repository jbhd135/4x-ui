name: 4x-ui Checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test account isolation against the release Xray core
        run: |
          set -euo pipefail
          mkdir -p /tmp/4x-ui-core-test
          curl -fLsS --retry 3 https://github.com/jbhd135/4x-ui/releases/download/v4.0.0/x-ui-linux-amd64.tar.gz -o /tmp/4x-ui-core-test/runtime.tar.gz
          tar -xzf /tmp/4x-ui-core-test/runtime.tar.gz -C /tmp/4x-ui-core-test x-ui/bin/xray-linux-amd64
          echo '345781b0068ff2535360f90bb2eb20551950bb4f92bc7d44d2e6c693fa7dc210  /tmp/4x-ui-core-test/x-ui/bin/xray-linux-amd64' | sha256sum -c -
          XRAY_TEST_BINARY=/tmp/4x-ui-core-test/x-ui/bin/xray-linux-amd64 go test -race ./xray -run TestClientIPRoutingRealCore -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: TZ=UTC node scripts/test-client-names.cjs
      - run: node scripts/test-client-create.cjs
      - run: node scripts/test-setting-defaults.cjs
      - run: node scripts/test-client-ip-migration.cjs
      - run: bash -n install.sh update.sh scripts/install-selfhosted.sh scripts/package-release.sh
      - run: shellcheck install.sh update.sh scripts/install-selfhosted.sh scripts/package-release.sh
      - name: Compile source snapshot (not the production release binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools sqlite3
          mkdir -p dist
          CC=musl-gcc CGO_ENABLED=1 go build -trimpath -ldflags '-linkmode external -extldflags -static' -o dist/x-ui .
      - name: Verify SQLite in the actual Linux binary
        run: |
          TEST_DIR=$(mktemp -d)
          trap 'rm -rf "$TEST_DIR"' EXIT
          XUI_DB_FOLDER="$TEST_DIR/db" XUI_LOG_FOLDER="$TEST_DIR/log" dist/x-ui setting -port 19897 -listenIP 127.0.0.1 -webBasePath /
          test "$(sqlite3 "$TEST_DIR/db/x-ui.db" 'PRAGMA quick_check;')" = ok
      - uses: actions/upload-artifact@v7
        with:
          name: source-build-linux-amd64
          path: dist/x-ui

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-build-linux-amd64
          path: dist
      - name: Assemble verified runtime
        run: |
          set -euo pipefail
          mkdir -p build/base build/output
          curl -fLsS --retry 3 \
            https://github.com/jbhd135/4x-ui/releases/download/v4.0.0/x-ui-linux-amd64.tar.gz \
            -o build/base/x-ui-linux-amd64.tar.gz
          curl -fLsS --retry 3 \
            https://github.com/jbhd135/4x-ui/releases/download/v4.0.0/SHA256SUMS \
            -o build/base/SHA256SUMS
          (cd build/base && sha256sum -c SHA256SUMS)
          tar -xzf build/base/x-ui-linux-amd64.tar.gz -C build
          install -m 755 dist/x-ui build/x-ui/x-ui
          install -m 644 LICENSE build/x-ui/LICENSE
          install -m 644 PROVENANCE.md build/x-ui/PROVENANCE.md
          install -m 755 scripts/install-selfhosted.sh build/x-ui/install-selfhosted.sh
          test "$(build/x-ui/x-ui -v)" = "${GITHUB_REF_NAME#v}"
          test ! -e build/x-ui/bin/config.json
          test ! -e build/x-ui/x-ui.db
          tar -czf build/output/x-ui-linux-amd64.tar.gz -C build x-ui
          (cd build/output && sha256sum x-ui-linux-amd64.tar.gz > SHA256SUMS)
          build/x-ui/x-ui -v
          file build/x-ui/x-ui
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/output/x-ui-linux-amd64.tar.gz \
            build/output/SHA256SUMS \
            --title "4x-ui $GITHUB_REF_NAME" \
            --generate-notes
